<title>星読みタロット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@500;700&family=Shippori+Mincho:wght@400;600;800&display=swap">
<style>
/* Layout: question card on top, controls, a table of cards on a night-sky cloth, then the reading */
:root {
  --night: #141a2e;      /* table cloth */
  --night-2: #1c2440;    /* raised surfaces */
  --ink: #e9e3d3;        /* text on night */
  --muted: #a39f95;
  --brass: #c9a35a;      /* accent */
  --paper: #f3ead6;      /* card face */
  --paper-ink: #2a2233;
  --rev: #d48a79;        /* reversed marker */
  --wands: #a8552a;
  --cups: #2f6b8a;
  --swords: #50546b;
  --pentacles: #7a6a1e;
  --major: #8a6420;
  --f-display: "Cormorant Unicase", "Times New Roman", serif;
  --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse at 50% -10%, #26305a 0%, transparent 60%),
    var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.8;
}
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 28px;
}
header { text-align: center; display: grid; gap: 4px; }
header .eyebrow {
  font-family: var(--f-display);
  letter-spacing: .3em;
  color: var(--brass);
  font-size: 13px;
}
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(28px, 6vw, 40px);
  letter-spacing: .12em;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); font-size: 14px; }

/* question */
.ask {
  max-width: 720px; width: 100%; margin: 0 auto;
  display: grid; gap: 8px;
}
.ask label { font-size: 14px; letter-spacing: .15em; color: var(--brass); }
.ask textarea {
  width: 100%;
  min-height: 84px;
  resize: vertical;
  font: inherit; font-size: 15px; line-height: 1.7;
  color: var(--ink);
  background: var(--night-2);
  border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent);
  border-radius: 8px;
  padding: 12px 14px;
}
.ask textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.ask textarea:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.ask .note { font-size: 12px; color: var(--muted); margin: 0; }

.controls {
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  justify-content: center; align-items: center;
}
.seg {
  display: inline-flex;
  border: 1px solid color-mix(in srgb, var(--brass) 50%, transparent);
  border-radius: 999px;
  overflow: hidden;
}
.seg button {
  font: inherit; font-size: 14px;
  background: transparent; color: var(--ink);
  border: 0; padding: 8px 18px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--night); font-weight: 600; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--brass); width: 16px; height: 16px; }
.btn {
  font: inherit; font-size: 15px; font-weight: 600;
  background: var(--brass); color: var(--night);
  border: 0; border-radius: 999px;
  padding: 10px 26px; cursor: pointer;
  letter-spacing: .08em;
}
.btn.ghost { background: transparent; color: var(--brass); border: 1px solid var(--brass); }
.btn:disabled { opacity: .5; cursor: default; }
button:focus-visible, .toggle input:focus-visible, .card:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 3px;
}
.deck-count { text-align: center; font-size: 12px; color: var(--muted); margin: -16px 0 0; }

/* table */
.table {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 20px;
  padding-block: 8px;
}
.slot { display: grid; gap: 10px; justify-items: center; width: clamp(96px, 26vw, 190px); }
.slot .pos { font-size: 13px; letter-spacing: .2em; color: var(--brass); }
.card {
  width: 100%;
  aspect-ratio: 7 / 12;
  max-width: 100%;
  perspective: 1000px;
  cursor: pointer;
  background: none; border: 0; padding: 0;
  border-radius: 10px;
}
.card-inner {
  position: relative; display: block; width: 100%; height: 100%;
  transition: transform .8s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  border-radius: 10px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 10px 24px rgb(0 0 0 / .45);
}
.back {
  background:
    radial-gradient(circle at 50% 50%, var(--brass) 0 6%, transparent 6.5%),
    radial-gradient(circle at 50% 50%, transparent 0 22%, color-mix(in srgb, var(--brass) 70%, transparent) 22.5% 23.5%, transparent 24%),
    repeating-linear-gradient(45deg, transparent 0 9px, color-mix(in srgb, var(--brass) 18%, transparent) 9px 10px),
    repeating-linear-gradient(-45deg, transparent 0 9px, color-mix(in srgb, var(--brass) 18%, transparent) 9px 10px),
    #232c52;
  border: 2px solid var(--brass);
  outline: 1px solid color-mix(in srgb, var(--brass) 50%, transparent);
  outline-offset: -8px;
}
.card:not(.flipped):hover .card-inner { transform: translateY(-6px); }
.front {
  transform: rotateY(180deg);
  background: var(--paper);
  color: var(--paper-ink);
  border: 2px solid var(--brass);
  padding: 8%;
}
.front-body {
  height: 100%;
  display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center;
  border: 1px solid color-mix(in srgb, var(--paper-ink) 35%, transparent);
  border-radius: 6px;
  padding: 6% 4%;
  transition: transform .3s;
}
.card.reversed .front-body { transform: rotate(180deg); }
.numeral { font-family: var(--f-display); font-weight: 700; font-size: clamp(12px, 3vw, 20px); letter-spacing: .1em; }
.glyph {
  font-size: clamp(36px, 10vw, 76px);
  line-height: 1;
  color: var(--major);
  font-family: "Segoe UI Symbol", "Noto Sans Symbols", "DejaVu Sans", serif;
  display: grid; place-items: center;
}
.glyph svg { width: clamp(30px, 8vw, 62px); height: auto; }
.suit-wands .glyph { color: var(--wands); }
.suit-cups .glyph { color: var(--cups); }
.suit-swords .glyph { color: var(--swords); }
.suit-pentacles .glyph { color: var(--pentacles); }
.names { text-align: center; line-height: 1.3; }
.names .ja { font-weight: 800; font-size: clamp(11px, 2.8vw, 17px); letter-spacing: .06em; }
.names .en { font-family: var(--f-display); font-size: clamp(8px, 1.9vw, 12px); letter-spacing: .1em; color: #6b5f6e; }

.hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }

/* reading */
.reading { display: grid; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; }
.reading h2 {
  margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .15em; text-align: center; color: var(--brass);
}
.entry {
  background: var(--night-2);
  border: 1px solid color-mix(in srgb, var(--brass) 25%, transparent);
  border-radius: 8px;
  padding: 16px 18px;
  display: grid; gap: 6px;
  animation: rise .5s ease-out;
}
.entry .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.entry .pos { font-size: 12px; letter-spacing: .2em; color: var(--brass); }
.entry .title { font-weight: 800; font-size: 18px; }
.pill {
  font-size: 12px; padding: 1px 10px; border-radius: 999px;
  border: 1px solid currentColor;
}
.pill.up { color: var(--brass); }
.pill.down { color: var(--rev); }
.entry .kw { color: var(--muted); font-size: 14px; }
.entry p { margin: 0; }

.oracle {
  border: 1px solid var(--brass);
  border-radius: 10px;
  padding: 20px 20px 22px;
  background: color-mix(in srgb, var(--brass) 7%, var(--night));
  display: grid; gap: 12px;
}
.oracle .q {
  margin: 0; font-size: 14px; color: var(--muted);
  border-left: 2px solid color-mix(in srgb, var(--brass) 60%, transparent);
  padding-left: 12px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.oracle .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.oracle .status { font-size: 13px; color: var(--muted); }
.oracle .text { display: grid; gap: 8px; overflow-wrap: anywhere; }
.oracle .text p { margin: 0; }
.oracle .text .h { color: var(--brass); font-weight: 600; letter-spacing: .08em; margin-top: 6px; }
.oracle .label { font-size: 12px; letter-spacing: .2em; color: var(--brass); }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
.dots::after { content: "…"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

footer { text-align: center; color: var(--muted); font-size: 12px; }

@media (prefers-reduced-motion: reduce) {
  .card-inner, .front-body { transition: none; }
  .entry { animation: none; }
  .dots::after { animation: none; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">TAROT · 78 CARDS</div>
    <h1>星読みタロット</h1>
    <p>悩みを心に描いて、78枚のカードから引いてみましょう</p>
  </header>

  <div class="ask">
    <label for="question">いまの悩みごと</label>
    <textarea id="question" maxlength="600" placeholder="例：転職するか今の会社に残るか迷っています。どちらを選ぶと後悔が少ないでしょうか。"></textarea>
    <p class="note">空欄のままでも引けます。書いた内容はこの画面の中だけで使われ、保存されません。</p>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="スプレッド">
      <button type="button" id="spread-1" data-n="1" aria-pressed="false">1枚引き</button>
      <button type="button" id="spread-3" data-n="3" aria-pressed="true">3枚引き</button>
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="use-reversed" checked> 逆位置あり</label>
      <label class="toggle"><input type="checkbox" id="use-minor" checked> 小アルカナを含める</label>
    </div>
    <button type="button" class="btn" id="draw">シャッフルして引く</button>
    <button type="button" class="btn ghost" id="reveal-all">すべてめくる</button>
  </div>
  <p class="deck-count" id="deck-count"></p>

  <div class="table" id="table" aria-live="polite"></div>
  <p class="hint" id="hint">カードをタップしてめくってください</p>

  <section class="reading" id="reading" aria-label="リーディング"></section>

  <footer>占いの結果は、考えを整えるためのヒントとしてお楽しみください</footer>
</div>

<script>
const MAJOR = [
  ["0","愚者","The Fool","○","自由・新しい始まり・冒険","無計画・軽率・現実逃避","まっさらな気持ちで一歩を踏み出すとき。結果を恐れず、好奇心に従ってみましょう。","勢いだけで動くと足元をすくわれます。計画を少しだけ立ててから進みましょう。"],
  ["I","魔術師","The Magician","∞","創造・意志・才能の発揮","空回り・準備不足・迷い","必要な道具はもう手の中にあります。思い描いたことを形にし始めましょう。","力はあるのに方向が定まっていません。目的をひとつに絞ると流れが戻ります。"],
  ["II","女教皇","The High Priestess","☾","直感・知性・静けさ","神経質・頑なさ・隠しごと","答えは静かな場所で見つかります。焦らず、内なる声に耳を澄ませて。","考えすぎて心が固くなっています。完璧を求めず、人に頼ることも大切です。"],
  ["III","女帝","The Empress","♀","豊かさ・愛情・実り","過保護・浪費・停滞","育ててきたものが実を結ぶ時期。自分も周りも、たっぷり慈しみましょう。","与えすぎ、甘やかしすぎに注意。満たされすぎると成長が止まります。"],
  ["IV","皇帝","The Emperor","♃","安定・責任・リーダーシップ","独断・支配・融通のなさ","基盤を固め、自分が舵を取るとき。責任を引き受けるほど信頼が集まります。","力で押し切ろうとしていませんか。周りの声を聞く余裕を持ちましょう。"],
  ["V","教皇","The Hierophant","✠","信頼・教え・伝統","形式主義・孤立・束縛","信頼できる人の助言や、昔ながらのやり方に助けられます。","決まりごとに縛られすぎています。自分の頭で考え直してみましょう。"],
  ["VI","恋人","The Lovers","♡","選択・調和・結びつき","迷い・不一致・誘惑","心がときめく方を選んで大丈夫。人とのつながりが力になります。","選べないまま時間が過ぎています。本当に大切なものは何か見つめ直して。"],
  ["VII","戦車","The Chariot","⇑","前進・勝利・行動力","暴走・挫折・方向喪失","迷わず進めば道は開けます。意志の強さが勝利を呼び込みます。","勢いが空回りしています。いったん止まって行き先を確かめましょう。"],
  ["VIII","力","Strength","♌","勇気・忍耐・内なる強さ","自信喪失・弱気・甘え","優しさは強さです。焦らずじっくり向き合えば、困難も手なずけられます。","自分を信じきれていません。小さな成功を積み重ねて自信を取り戻して。"],
  ["IX","隠者","The Hermit","✧","内省・探求・思慮深さ","孤立・閉鎖的・頑固","ひとりの時間が答えを照らします。急がず、自分の内側を探ってみて。","殻に閉じこもりすぎています。誰かに話すだけで視界が開けるかもしれません。"],
  ["X","運命の輪","Wheel of Fortune","☸","転機・幸運・巡り合わせ","すれ違い・停滞・タイミングのずれ","流れが変わる瞬間です。巡ってきたチャンスは迷わずつかみましょう。","今は風向きが悪いだけ。無理に動かず、次の巡りを待つのも手です。"],
  ["XI","正義","Justice","⚖","公正・均衡・正しい判断","不公平・偏り・優柔不断","感情と事実を分けて考えれば、正しい判断ができます。","どちらかに偏っています。もう一方の言い分にも耳を傾けてみて。"],
  ["XII","吊るされた男","The Hanged Man","▽","試練・忍耐・視点の転換","徒労・自己犠牲・停滞","動けない時間にも意味があります。見方を変えると新しい答えが見えます。","報われない我慢を続けていませんか。手放す勇気も必要です。"],
  ["XIII","死神","Death","♄","終わりと再生・変化","変化への抵抗・未練","ひとつの区切りが訪れます。終わりは新しい始まりの準備です。","終わったものにしがみついています。手放せば次の扉が開きます。"],
  ["XIV","節制","Temperance","⧖","調和・節度・バランス","不安定・浪費・不調和","異なるものをうまく混ぜ合わせるとき。ほどよいペースが鍵です。","やりすぎ、または足りなさが目立ちます。生活のリズムを整えましょう。"],

  ["XX","審判","Judgement","⊕","復活・目覚め・決断","後悔・先延ばし・やり残し","眠っていた想いや可能性がよみがえります。呼びかけに応えるときです。","過去を悔やんで足が止まっています。今からでも遅くはありません。"],
  ["XXI","世界","The World","◎","完成・達成・統合","未完成・中途半端・あと一歩","ひとつの物語が美しく完結します。達成を味わい、次の旅へ。","ゴールはすぐそこです。最後の仕上げを丁寧に終わらせましょう。"],

const MINOR_TEXT = {

const POSITIONS = { 1: ["今日のカード"], 3: ["過去", "現在", "未来"] };

const reading = document.getElementById("reading");
const hint = document.getElementById("hint");
const useReversed = document.getElementById("use-reversed");
const useMinor = document.getElementById("use-minor");

let count = 3;
let drawn = [];
let oracleCtl = null;

const samplePromise = window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);

function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function rand(n) { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function deck() { return useMinor.checked ? MAJOR.concat(MINOR) : MAJOR; }

function deal() {
  oracleCtl?.abort();
  oracleCtl = null;
  const cards = deck();
  deckCount.textContent = `${cards.length}枚のデッキから${count}枚を引きます`;
  drawn = shuffle(cards).slice(0, count).map((card, i) => ({
    card,
    pos: POSITIONS[count][i],
    reversed: useReversed.checked && rand(2) === 1,
    open: false,
  }));
  table.innerHTML = "";
  reading.innerHTML = "";
  drawn.forEach((d, i) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    const glyph = d.card.suit === "major" ? `${d.card.glyph}︎` : d.card.glyph;
    slot.innerHTML = `
      <span class="pos">${d.pos}</span>
      <button type="button" class="card suit-${d.card.suit}${d.reversed ? " reversed" : ""}" id="card-${i}" aria-label="${d.pos}のカードをめくる">
        <span class="card-inner">
          <span class="face back"></span>
          <span class="face front"><span class="front-body">
            <span class="numeral">${d.card.num}</span>
            <span class="glyph">${glyph}</span>
            <span class="names"><span class="ja">${d.card.ja}</span><br><span class="en">${d.card.en}</span></span>
          </span></span>
        </span>
      </button>`;
    slot.querySelector(".card").addEventListener("click", () => reveal(i));
    table.appendChild(slot);
  });
  hint.hidden = false;
}

function reveal(i) {
  const d = drawn[i];
  if (d.open) return;
  d.open = true;
  const el = document.getElementById(`card-${i}`);
  el.classList.add("flipped");
  el.setAttribute("aria-label", `${d.pos}：${d.card.ja}（${d.reversed ? "逆位置" : "正位置"}）`);
  renderReading();
}

function renderReading() {
  const opened = drawn.filter(d => d.open);
  const all = opened.length === drawn.length;
  hint.hidden = all;
  reading.innerHTML = opened.length ? `<h2>リーディング</h2>` : "";
  drawn.forEach(d => {
    if (!d.open) return;
    const c = d.card;
    const div = document.createElement("article");
    div.className = "entry";
    div.innerHTML = `
      <div class="head">
        <span class="pos">${d.pos}</span>
        <span class="title">${c.ja}</span>
        <span class="pill ${d.reversed ? "down" : "up"}">${d.reversed ? "逆位置" : "正位置"}</span>
      </div>
      <div class="kw">${d.reversed ? c.revKw : c.upKw}</div>
      <p>${d.reversed ? c.revMsg : c.upMsg}</p>`;
    reading.appendChild(div);
  });
  if (all) renderOracle();
}

function renderOracle() {
  const q = question.value.trim();
  const box = document.createElement("section");
  box.className = "oracle";

    <div class="actions">
      <button type="button" class="btn" id="oracle-go">悩みに沿って読み解く</button>
      <span class="status" id="oracle-status"></span>
    </div>
    <div class="text" id="oracle-text"></div>`;
  reading.appendChild(box);
  box.querySelector("#oracle-go").addEventListener("click", runOracle);

function spreadSummary() {
  return drawn.map(d => {
    const c = d.card;
    const kind = c.suit === "major" ? "大アルカナ" : `小アルカナ・${c.suitTheme}のスート`;
    return `- ${d.pos}：${c.ja}（${c.en}／${kind}）${d.reversed ? "逆位置" : "正位置"}。キーワード：${d.reversed ? c.revKw : c.upKw}`;
  }).join("\n");
}

function buildPrompt(q) {
  return `あなたは経験豊かで、相談者に温かく寄り添うタロット占い師です。
次の相談とスプレッドを読み、相談内容に具体的に結びつけたリーディングを日本語で書いてください。

# 相談内容
${q || "（特定の悩みはなし。いまの全体的な流れを知りたい）"}

# スプレッド（${drawn.length === 1 ? "1枚引き" : "3枚引き：過去・現在・未来"}）
${spreadSummary()}

# 書き方
- 各カードごとに、見出し行「【${drawn[0].pos}】カード名（正位置／逆位置）」を置き、その下に相談内容に即した解釈を2〜3文。
- 続けて「【全体のメッセージ】」で、カード同士のつながりから見える流れを3〜4文。
- 最後に「【アドバイス】」で、今日から試せる具体的な行動を2〜3個、各行の先頭に「・」。
- Markdown記号（#、*、**）は使わず、見出しは【】だけで示す。
- 不安をあおる断定は避け、前向きで現実的な言葉にする。健康・法律・お金の問題では断定的な助言をせず、必要に応じて専門家への相談を勧める。
- 全体で400〜650字程度。前置きや締めのあいさつは不要。`;
}

function paint(target, text) {
  target.replaceChildren();
  for (const line of text.split(/\n+/)) {
    const t = line.trim();
    if (!t) continue;
    const p = document.createElement("p");
    if (/^【.+】/.test(t)) p.className = "h";
    p.textContent = t;
    target.appendChild(p);
  }
}

async function runOracle() {
  const btn = document.getElementById("oracle-go");
  const status = document.getElementById("oracle-status");
  const out = document.getElementById("oracle-text");
  const q = question.value.trim();
  btn.disabled = true;
  status.className = "status dots";
  status.textContent = "カードの声を聴いています";
  out.replaceChildren();

  const sample = await samplePromise;
  if (!sample) {
    status.className = "status";
    status.textContent = "簡易リーディング（AIを使わず、カードの意味から組み立てています）";
    paint(out, localReading(q));
    btn.disabled = false;
    btn.textContent = "もう一度読み解く";
    return;
  }
  const ctl = new AbortController();
  oracleCtl = ctl;
  try {
    const { text } = await sample(buildPrompt(q), {
      signal: ctl.signal,
      cache: false,
      onText: ({ text }) => { status.className = "status"; status.textContent = "Claude によるリーディング"; paint(out, text); },
    });
    paint(out, text);
    status.className = "status";
    status.textContent = "Claude によるリーディング";
  } catch (e) {
    if (e?.code === "cancelled") return;
    status.className = "status";
    const why = {
      not_granted: "AIの利用が許可されなかったため、",
      rate_limited: "AIが混み合っているため、",
    }[e?.code] || "AIのリーディングを取得できなかったため、";
    status.textContent = `${why}カードの意味から組み立てた簡易リーディングを表示しています`;
    paint(out, localReading(q));
  } finally {
    if (oracleCtl === ctl) oracleCtl = null;
    btn.disabled = false;
    btn.textContent = "もう一度読み解く";
  }
}

function localReading(q) {
  const topic = TOPICS.find(t => t.re.test(q));
  const lines = [];
  lines.push(q
    ? `「${q.length > 60 ? q.slice(0, 60) + "…" : q}」というご相談を、${topic ? topic.key + "の視点から" : "カードの流れから"}読み解きます。`
    : "いまのあなたの全体的な流れを読み解きます。");
  const frame = { "過去": "これまでの流れには", "現在": "今のあなたには", "未来": "この先には", "今日のカード": "今日のあなたには" };
  for (const d of drawn) {
    const c = d.card;
    lines.push(`【${d.pos}】${c.ja}（${d.reversed ? "逆位置" : "正位置"}）`);
    const kw = (d.reversed ? c.revKw : c.upKw).split("・")[0];
    lines.push(`${frame[d.pos]}「${kw}」の気配があります。${d.reversed ? c.revMsg : c.upMsg}`);
  }
  const ups = drawn.filter(d => !d.reversed).length;
  const majors = drawn.filter(d => d.card.suit === "major").length;
  lines.push("【全体のメッセージ】");
  let tone = ups === drawn.length ? "カードは全体として追い風を示しています。"
    : ups === 0 ? "今は立ち止まって見直す時期だとカードは告げています。"
    : "良い流れと課題が混ざり合っています。うまくいっている部分を足場にしましょう。";
  if (majors >= 2) tone += "大アルカナが多く出ており、人生の節目といえる大切なテーマです。";
  const last = drawn[drawn.length - 1];
  lines.push(tone + (topic ? (ups * 2 >= drawn.length ? topic.up : topic.down) : ""));
  lines.push("【アドバイス】");
  lines.push(`・「${(last.reversed ? last.card.revKw : last.card.upKw).split("・")[0]}」を意識して、今日できる小さな行動をひとつ決める`);
  lines.push("・気になっていることを紙に書き出し、事実と気持ちを分けてみる");
  return lines.join("\n");
}

function setCount(n) {
  count = n;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n)));
  save("tarot-count", n);
  deal();
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setCount(+b.dataset.n)));
document.getElementById("draw").addEventListener("click", deal);
document.getElementById("reveal-all").addEventListener("click", () => {
  drawn.forEach((_, i) => setTimeout(() => reveal(i), i * 250));
});
useReversed.checked = load("tarot-reversed", true);
useMinor.checked = load("tarot-minor", true);
useReversed.addEventListener("change", () => { save("tarot-reversed", useReversed.checked); deal(); });
useMinor.addEventListener("change", () => { save("tarot-minor", useMinor.checked); deal(); });

setCount(load("tarot-count", 3) === 1 ? 1 : 3);
</script>
